<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>햄스터 마을 · 테스트 (모바일 화면)</title>
<style>
html,body{margin:0;height:100%;background:#efe4dc;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
#ph{width:412px;height:800px;border:10px solid #5b4038;border-radius:44px;overflow:hidden;box-shadow:0 20px 50px rgba(91,64,56,.3);background:#fff;transform-origin:center center;flex:0 0 auto}
#ph iframe{width:412px;height:800px;border:0;display:block}
#bar{display:flex;align-items:center;gap:10px;font-size:13px;color:#7a5a4e}
#bar a{color:#c2604b;font-weight:700;text-decoration:none;background:#fff;padding:5px 12px;border-radius:99px}
</style>
</head>
<body>
<div id="ph"><iframe id="fr" title="햄스터 마을" allow="autoplay; screen-wake-lock"></iframe></div>
<div id="bar"><span>휴대폰 화면(412×800)으로 테스트 중</span><a id="pc" href="#">PC 화면으로 보기</a><a id="rl" href="#">새로고침</a></div>
<script>
var q=location.search||'?test';
document.getElementById('fr').src='./'+q+(q.indexOf('?')<0?'?':'&')+'inframe';
document.getElementById('pc').href='./'+q+'&pc';
document.getElementById('rl').onclick=function(e){e.preventDefault();document.getElementById('fr').contentWindow.location.reload();};
function fit(){var s=Math.min(1,(innerHeight-60)/820,(innerWidth-20)/432),ph=document.getElementById('ph');ph.style.transform='scale('+s+')';ph.style.margin=(-(1-s)*410)+'px 0';}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
